<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selvr benchmarks</title>
  <style>
    :root {
      --bg: #0d0f14; --surface: #13161f; --border: #232736;
      --text: #e2e8f0; --muted: #64748b; --accent: #00d4aa;
      --bad: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 40px; height: 56px; display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 20px; font-weight: 800; color: var(--accent); text-decoration: none; }
    main { max-width: 980px; margin: 40px auto 80px; padding: 0 24px; }
    h1 { font-size: 28px; margin-bottom: 18px; }
    p { color: var(--muted); line-height: 1.65; margin: 0; }
    a { color: var(--accent); }
    .toolbar { display: flex; align-items: center; gap: 16px; margin: 18px 0; }
    button {
      background: var(--accent); color: #04241c; border: 0; border-radius: 8px;
      padding: 8px 14px; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: progress; }
    #status { margin: 0; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    .table-wrap + .table-wrap { margin-top: 28px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; background: var(--surface); }
    td { background: #10131a; }
    tr:last-child td { border-bottom: 0; }
    .fail { color: var(--bad); }
    .ok { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="../index.html">Selvr</a>
  </header>
  <main>
    <h1>Benchmarks</h1>
    <div class="toolbar">
      <button id="run" type="button">Run again</button>
      <p id="status">Starting the run…</p>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Workload</th>
            <th>Problem</th>
            <th>Result</th>
            <th>selvr-vm</th>
            <th>selvr-js</th>
            <th>plain-js</th>
            <th>vm / plain</th>
          </tr>
        </thead>
        <tbody>
          <tr id="row-fib">
            <td>fib</td><td>fib(40)</td>
            <td class="result">—</td><td class="vm">—</td><td class="js">—</td><td class="plain">—</td><td class="ratio">—</td>
          </tr>
          <tr id="row-sieve">
            <td>sieve</td><td>sieve(10000)</td>
            <td class="result">—</td><td class="vm">—</td><td class="js">—</td><td class="plain">—</td><td class="ratio">—</td>
          </tr>
          <tr id="row-matmul">
            <td>matmul</td><td>32×32</td>
            <td class="result">—</td><td class="vm">—</td><td class="js">—</td><td class="plain">—</td><td class="ratio">—</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Startup</th>
            <th>selvr-vm</th>
            <th title="react 18.3.1 and react-dom 18.3.1">React</th>
            <th title="vue 3.5.22">Vue</th>
            <th title="Angular 19.2.15">Angular</th>
          </tr>
        </thead>
        <tbody>
          <tr id="row-startup">
            <td>startup</td>
            <td class="vm">—</td>
            <td class="react">—</td>
            <td class="vue">—</td>
            <td class="angular">—</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <script type="module" src="./page.mjs"></script>
</body>
</html>
